# Tox automatiza el entrenamiento, las pruebas y la construcción del paquete en ambientes virtuales limpios.
# Instalar con `pip install tox` (versión 4). Ambientes:
#   tox -e train          entrena el modelo con resumen_empresas (necesita `dvc pull` en la raíz del repositorio)
#   tox -e test_package   corre las pruebas con el modelo ya entrenado que trae el paquete
#   tox -e build          construye el .whl en dist/
#   tox -e checks         revisa estilo (flake8) y orden de importaciones (isort)

[tox]
min_version = 4
envlist = test_package, checks
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
setenv =
	PYTHONPATH=.
	PYTHONHASHSEED=0
passenv =
	ALERTA_DATOS
	MLFLOW_TRACKING_URI
	MLFLOW_EXPERIMENT

[testenv:test_package]
envdir = {toxworkdir}/test_package
deps =
	-r requirements/test_requirements.txt
commands =
	pytest -vv {posargs:tests/}

[testenv:train]
envdir = {toxworkdir}/train
deps =
	-r requirements/train_requirements.txt
	-r requirements/test_requirements.txt
commands =
	python alerta_insolvencia/train_pipeline.py
	pytest -vv {posargs:tests/}

[testenv:build]
envdir = {toxworkdir}/build
deps =
	build
commands =
	python -m build --wheel --outdir dist

[testenv:checks]
envdir = {toxworkdir}/checks
deps =
	-r requirements/typing_requirements.txt
commands =
	flake8 alerta_insolvencia tests
	isort --check-only --diff alerta_insolvencia tests

[flake8]
exclude = .git,.tox,build,dist
max-line-length = 120
