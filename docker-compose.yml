# Despliegue de la API de inferencia y del tablero en una sola máquina (EC2 de AWS).
#
# Uso, desde la raíz del repositorio (ver docs/despliegue.md):
#     sudo docker compose up -d --build
#
# El tablero lee data/processed/resumen_empresas.parquet (se trae con `dvc pull` o se copia con scp) y le pide
# todas las predicciones a la API por la red interna de Docker (API_URL=http://api:8001), así que no depende
# de la IP pública de la máquina, que cambia cada vez que se detiene y se enciende.
name: alerta-insolvencia

services:
  api:
    build: ./api
    image: alerta-insolvencia-api:2.0.0
    container_name: api
    ports:
      - "8001:8001"
    restart: unless-stopped

  tablero:
    build: ./dashboard
    image: alerta-insolvencia-tablero:1.0.0
    container_name: tablero
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8001
      DATOS_RESUMEN: /opt/tablero/datos/resumen_empresas.parquet
    ports:
      - "8050:8050"
    volumes:
      - ./data/processed:/opt/tablero/datos:ro
    restart: unless-stopped
