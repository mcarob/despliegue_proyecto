# Tox crea ambientes limpios para probar y correr la API. Instalar con `pip install tox` (versión 4).
#   tox -e test_app   instala el .whl del modelo y corre las pruebas de la API
#   tox -e run        levanta la API en http://localhost:8001 (documentación en /docs)
#   tox -e checks     revisa estilo (flake8) y orden de importaciones (isort)

[pytest]
log_cli_level = WARNING

[tox]
min_version = 4
envlist = test_app, checks
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}
setenv =
	PYTHONPATH=.
	PYTHONHASHSEED=0

[testenv:test_app]
deps =
	-r test_requirements.txt
commands =
	pytest -vv {posargs:app/tests/}

[testenv:run]
envdir = {toxworkdir}/test_app
deps =
	{[testenv:test_app]deps}
commands =
	python app/main.py

[testenv:checks]
envdir = {toxworkdir}/checks
deps =
	-r typing_requirements.txt
commands =
	flake8 app
	isort --check-only --diff app

[flake8]
exclude = .git,__pycache__,.tox,.pytest_cache
max-line-length = 120

[isort]
profile = black
line_length = 120
